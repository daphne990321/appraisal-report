[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appraisal"
version = "0.1.0"
description = "不動產估價報告系統後端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
]

# 測試用的 AsyncClient 與 ASGITransport 來自 httpx
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/appraisal"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# 註解與 docstring 使用繁體中文，全形標點不算易混淆字元
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["appraisal"]
# 後端根目錄有 alembic/ 資料夾，不加這行 isort 會把 alembic 套件當成 first-party
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
