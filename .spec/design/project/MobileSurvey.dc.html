<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：現勘</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #161B26; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9DDE4; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
    <a href="MobileList.dc.html" aria-label="回到案件清單" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #161B26"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C6475">115-0436</span>
      <span style="font-weight: 700; font-size: 16px">③ 現勘・新竹市東區 透天厝</span>
    </div>
  </header>
  <div style="padding: 8px 16px; background: #E6EBF7; color: #2747A0; font-size: 13px">使用現況 4／9 題・照片 6 張</div>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; margin-bottom: 8px">是否入內勘察</legend>
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; height: 48px; border: 2px solid #2747A0; border-radius: 10px; background: #E6EBF7; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500"><input type="radio" name="in" checked="checked" style="width: 18px; height: 18px">已入內</label>
        <label style="flex: 1; height: 48px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px"><input type="radio" name="in" style="width: 18px; height: 18px">未能入內</label>
      </div>
      <span style="font-size: 13px; color: #5C6475">未能入內時報告會自動揭露（注意須知四）</span>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; margin-bottom: 8px">使用現況</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="height: 44px; border: 2px solid #2747A0; border-radius: 10px; background: #E6EBF7; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500"><input type="radio" name="use" checked="checked">自用</label>
        <label style="height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="use">出租</label>
        <label style="height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="use">閒置</label>
        <label style="height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="use">使用借貸</label>
        <label style="height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="use">過戶中</label>
        <label style="height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="use">無法判斷</label>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="bu" style="font-size: 15px; font-weight: 700">整棟建物使用型態</label>
      <input id="bu" type="text" value="1 樓車庫、2 樓以上住家" style="height: 48px; padding: 0 12px; border: 1px solid #D9DDE4; border-radius: 10px; font: 16px 'Noto Sans TC', sans-serif; background: #FFFFFF">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; margin-bottom: 8px">增建情形</legend>
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; height: 44px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px"><input type="radio" name="ext">無</label>
        <label style="flex: 1; height: 44px; border: 2px solid #2747A0; border-radius: 10px; background: #E6EBF7; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500"><input type="radio" name="ext" checked="checked">有</label>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <label for="ea" style="font-size: 14px; color: #3A4253">增建面積</label>
        <input id="ea" type="text" inputmode="decimal" value="6.2" style="width: 90px; height: 44px; padding: 0 10px; border: 1px solid #D9DDE4; border-radius: 10px; font: 16px 'IBM Plex Mono', monospace; text-align: right">
        <span style="font-size: 14px">坪</span>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; font-weight: 700">照片</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="aspect-ratio: 1; border-radius: 8px; background: #D9DDE4; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-size: 12px; color: #3A4253">外觀</div>
        <div style="aspect-ratio: 1; border-radius: 8px; background: #D9DDE4; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-size: 12px; color: #3A4253">客廳</div>
        <div style="aspect-ratio: 1; border-radius: 8px; background: #D9DDE4; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-size: 12px; color: #3A4253">增建</div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #D9DDE4; display: flex; gap: 8px">
    <button type="button" style="flex: 1; height: 48px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; color: #161B26; font: 500 15px 'Noto Sans TC', sans-serif">拍照</button>
    <button type="button" style="flex: 2; height: 48px; border: 0; border-radius: 10px; background: #2747A0; color: #FFFFFF; font: 500 15px 'Noto Sans TC', sans-serif">確認儲存（3 處）</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
