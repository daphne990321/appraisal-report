<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>登入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F4F5F7; color: #161B26; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 48px 16px">
  <main style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 8px; background: #2747A0; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V9l7-5 7 5v12"></path><path d="M9 21v-6h6v6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 700">估價報告系統</span>
        <span style="font-size: 13px; color: #5C6475">不動產估價師事務所</span>
      </div>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #D9DDE4; border-radius: 10px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">登入</h1>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #D9DDE4; border-radius: 6px; background: #FFFFFF; color: #161B26; font: inherit; font-size: 15px">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 4px; background: #EDEFF3; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">G</span>用 Google 帳號登入</button>
        <button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #D9DDE4; border-radius: 6px; background: #FFFFFF; color: #161B26; font: inherit; font-size: 15px">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 4px; background: #EDEFF3; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>用 Microsoft 365 帳號登入</button>
        <button type="button" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #D9DDE4; border-radius: 6px; background: #FFFFFF; color: #161B26; font: inherit; font-size: 15px">
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 4px; background: #EDEFF3; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">f</span>用 Meta 帳號登入</button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; color: #5C6475; font-size: 13px">
        <div style="flex: 1; height: 1px; background: #D9DDE4"></div>或用本系統帳號<div style="flex: 1; height: 1px; background: #D9DDE4"></div>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="email" style="font-size: 13px; font-weight: 500; color: #3A4253">電子郵件</label>
          <input id="email" type="email" value="lin@example-office.tw" style="height: 42px; padding: 0 12px; border: 1px solid #C9CED8; border-radius: 6px; font: inherit; font-size: 15px; color: #161B26; background: #FFFFFF">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="pw" style="font-size: 13px; font-weight: 500; color: #3A4253">密碼</label>
            <a href="#forgot" style="font-size: 13px">忘記密碼</a>
          </div>
          <input id="pw" type="password" value="password" style="height: 42px; padding: 0 12px; border: 1px solid #C9CED8; border-radius: 6px; font: inherit; font-size: 15px; color: #161B26; background: #FFFFFF">
        </div>
        <button type="submit" style="height: 44px; border: 0; border-radius: 6px; background: #2747A0; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500">登入</button>
      </form>
    </section>

    <p style="margin: 0; font-size: 13px; color: #5C6475; line-height: 1.7; text-align: center">本系統不開放自行註冊。帳號由事務所管理者邀請建立。<br>收到邀請信後，用信中的連結設定密碼或綁定外部帳號。</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
