<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>案件清單與看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="min-height: 1000px; background: {{p.bg}}; color: {{p.ink}}; font-family: 'Noto Sans TC', system-ui, sans-serif">
  <header style="background: #161B26; color: #EEF0F4; padding: 0 24px; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 7px; background: {{p.seal}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700" aria-hidden="true">估</div>
      <span style="font-weight: 700">○○不動產估價師事務所</span>
    </div>
    <nav style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1" aria-label="主選單">
      <a href="#" style="padding: 8px 14px; border-radius: 8px; background: #2A3142; color: #FFFFFF; text-decoration: none; font-size: 15px">案件</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">接案初估</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">估價模型</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">事務所設定</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">成員</a>
    </nav>
    <span style="font-size: 14px; color: #A9B1C2">林○○・估價師</span>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-size: 28px">案件</h1>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <div style="display: flex; gap: 4px; background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 10px; padding: 4px" role="tablist" aria-label="檢視方式">
          <button type="button" role="tab" onClick="{{toList}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 7px; background: {{listBg}}; color: {{listInk}}; font: 500 14px 'Noto Sans TC', sans-serif; cursor: pointer">清單</button>
          <button type="button" role="tab" onClick="{{toBoard}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 7px; background: {{boardBg}}; color: {{boardInk}}; font: 500 14px 'Noto Sans TC', sans-serif; cursor: pointer">看板</button>
          <a href="CaseCalendar.dc.html" style="height: 36px; padding: 0 14px; border-radius: 7px; color: {{p.muted}}; font: 500 14px 'Noto Sans TC', sans-serif; display: inline-flex; align-items: center; text-decoration: none">月曆</a>
        </div>
        <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid {{p.line}}; border-radius: 8px; background: #FFFFFF; color: {{p.ink}}; font: 500 15px 'Noto Sans TC', sans-serif">一次建立多件</button>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: {{p.accent}}; color: #FFFFFF; font: 500 15px 'Noto Sans TC', sans-serif">新增案件</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
        <button type="button" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.ink}}; font: 500 14px 'Noto Sans TC', sans-serif; cursor: pointer">{{f.label}} <span style="font-family: 'IBM Plex Mono', monospace">{{f.count}}</span></button>
      </sc-for>
      <div style="flex: 1 1 200px; display: flex; justify-content: flex-end">
        <label for="q" style="position: absolute; left: -9999px">搜尋案件</label>
        <input id="q" type="search" placeholder="搜尋案號、地址、委託人" style="width: 100%; max-width: 300px; height: 40px; padding: 0 12px; border: 1px solid {{p.line}}; border-radius: 8px; font: 15px 'Noto Sans TC', sans-serif; background: #FFFFFF">
      </div>
    </div>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 12px; overflow-x: auto">
        <table style="width: 100%; min-width: 960px; border-collapse: collapse; font-size: 15px">
          <thead>
            <tr style="text-align: left; color: {{p.muted}}; font-size: 13px">
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">案號</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">標的</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">委託人・目的</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">進度</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">負責人</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">期限</th>
              <th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{p.line}}">狀態</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
              <tr>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}; font-family: 'IBM Plex Mono', monospace"><a href="CaseStep.dc.html" style="color: {{p.accent}}">{{c.no}}</a></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}"><div style="font-weight: 500">{{c.addr}}</div><div style="font-size: 13px; color: {{p.muted}}">{{c.kind}}</div></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}"><div>{{c.client}}</div><div style="font-size: 13px; color: {{p.muted}}">{{c.purpose}}</div></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}">
                  <div style="font-size: 14px">第 {{c.step}}／7 步・{{c.stage}}</div>
                  <div style="margin-top: 6px; height: 6px; width: 140px; border-radius: 3px; background: {{p.line}}"><div style="height: 6px; width: {{c.bar}}; border-radius: 3px; background: {{p.accent}}"></div></div>
                </td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}">{{c.who}}</td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}"><span style="padding: 3px 10px; border-radius: 12px; background: {{c.dueBg}}; color: {{c.dueInk}}; font-size: 13px; font-weight: 500; white-space: nowrap">{{c.due}}</span></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid {{p.line}}"><span style="padding: 3px 10px; border-radius: 12px; background: {{c.stBg}}; color: {{c.stInk}}; font-size: 13px; font-weight: 500; white-space: nowrap">{{c.status}}</span></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </sc-if>

    <sc-if value="{{isBoard}}" hint-placeholder-val="{{ false }}">
      <div style="overflow-x: auto">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr)); gap: 12px; min-width: 1300px">
          <sc-for list="{{columns}}" as="col" hint-placeholder-count="7">
            <div style="background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 420px">
              <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>{{col.name}}</span><span style="color: {{p.muted}}; font-family: 'IBM Plex Mono', monospace">{{col.count}}</span></div>
              <sc-for list="{{col.items}}" as="c" hint-placeholder-count="1">
                <a href="CaseStep.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid {{p.line}}; border-radius: 8px; color: {{p.ink}}; text-decoration: none; background: {{p.bg}}">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{p.accent}}">{{c.no}}</span>
                  <span style="font-size: 14px; font-weight: 500">{{c.addr}}</span>
                  <span style="font-size: 13px; color: {{p.muted}}">{{c.who}}</span>
                  <span style="align-self: flex-start; padding: 2px 8px; border-radius: 10px; background: {{c.dueBg}}; color: {{c.dueInk}}; font-size: 13px">{{c.due}}</span>
                </a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["青綠（沿用舊版）","地籍藍"],"default":"地籍藍"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { view: 'list', filter: 'open' }; }
  renderVals() {
    const PAL = {
      '青綠（沿用舊版）': { accent: '#1F5E66', soft: '#E1EDEE', bg: '#F3F5F4', line: '#D3DAD9', ink: '#161B26', muted: '#5A676C', seal: '#B23A2B' },
      '地籍藍': { accent: '#2747A0', soft: '#E6EBF7', bg: '#F4F5F7', line: '#D9DDE4', ink: '#161B26', muted: '#5C6475', seal: '#B4381F' }
    };
    const p = PAL[this.props.palette ?? '地籍藍'] || PAL['地籍藍'];
    const tone = {
      ok: ['#E0F0E6', '#1F5A38'], warn: ['#FBEFD9', '#7A4B00'], fail: ['#F8E1DF', '#8E1F17'], plain: [p.soft, p.accent], grey: ['#ECF0EF', '#3A4253'], seal: [p.seal, '#FFFFFF']
    };
    const STAGES = ['接案', '調資料', '現勘', '比較標的', '試算', '決定價格', '簽名交付'];
    const raw = [
      { no: '115-0412', addr: '新竹縣竹北市 住宅大樓 12 樓', kind: '區分所有建物', client: '王○○', purpose: '買賣參考', step: 5, who: '林○○', due: '3 天後・115/11/25', dueT: 'warn', status: '進行中', stT: 'plain' },
      { no: '115-0420', addr: '新北市林口區 土地', kind: '土地', client: '○○建設股份有限公司', purpose: '抵押權設定', step: 2, who: '陳○○（助理）', due: '115/12/05', dueT: 'grey', status: '進行中', stT: 'plain' },
      { no: '115-0431', addr: '高雄市前金區 旅館', kind: '旅館', client: '○○國際股份有限公司', purpose: '買賣參考', step: 6, who: '林○○', due: '已逾期 2 天', dueT: 'fail', status: '待確認', stT: 'warn' },
      { no: '115-0436', addr: '新竹市東區 透天厝', kind: '透天厝', client: '張○○', purpose: '抵押權設定', step: 3, who: '陳○○（助理）', due: '明天・115/11/23', dueT: 'warn', status: '退回修改', stT: 'fail' },
      { no: '115-0441', addr: '臺北市大安區 公寓 4 樓', kind: '區分所有建物', client: '李○○', purpose: '抵押權設定', step: 1, who: '林○○', due: '115/12/10', dueT: 'grey', status: '暫停', stT: 'grey' },
      { no: '115-0398', addr: '桃園市中壢區 住宅大樓 8 樓', kind: '區分所有建物', client: '黃○○', purpose: '抵押權設定', step: 7, who: '林○○', due: '115/11/18 已交付', dueT: 'ok', status: '已簽名', stT: 'seal' }
    ];
    const cases = raw.map((c) => ({ ...c, stage: STAGES[c.step - 1], bar: Math.round(c.step / 7 * 140) + 'px', dueBg: tone[c.dueT][0], dueInk: tone[c.dueT][1], stBg: tone[c.stT][0], stInk: tone[c.stT][1] }));
    const F = [['open', '進行中', 4], ['mine', '我負責的', 3], ['review', '待我確認', 1], ['soon', '3 天內到期', 2], ['overdue', '已逾期', 1], ['done', '已交付', 1], ['all', '全部', 6]];
    const filters = F.map((f) => {
      const on = this.state.filter === f[0];
      return { label: f[1], count: f[2], bg: on ? p.accent : '#FFFFFF', ink: on ? '#FFFFFF' : p.ink, border: on ? p.accent : p.line, pick: () => this.setState({ filter: f[0] }) };
    });
    const columns = STAGES.map((s, i) => { const items = cases.filter((c) => c.step === i + 1); return { name: s, count: items.length, items: items }; });
    const list = this.state.view === 'list';
    return {
      p: p, cases: cases, filters: filters, columns: columns, isList: list, isBoard: !list,
      listBg: list ? p.soft : 'transparent', listInk: list ? p.accent : p.muted,
      boardBg: list ? 'transparent' : p.soft, boardInk: list ? p.muted : p.accent,
      toList: () => this.setState({ view: 'list' }), toBoard: () => this.setState({ view: 'board' })
    };
  }
}
</script>
</body>
</html>
