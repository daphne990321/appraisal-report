<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：交接與確認</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #161B26; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #D9DDE4; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
    <a href="MobileList.dc.html" aria-label="回到案件清單" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #161B26"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C6475">115-0431</span>
      <span style="font-weight: 700; font-size: 16px">高雄市前金區 旅館</span>
    </div>
    <span style="padding: 2px 8px; border-radius: 10px; background: #FDF0D8; color: #7A4A00; font-size: 13px">待確認</span>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #FFFFFF; border: 1px solid #D9DDE4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #5C6475">陳○○ 交接給你・11/21 17:30</div>
      <div style="font-size: 15px; line-height: 1.8">⑥ 決定價格完成，請確認權重與決定理由。收益法和成本法差距較大，理由寫在第 3 段。</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D9DDE4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; color: #5C6475">決定價格</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px">[決定金額] 萬元</div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span>收益法（DCF）</span><span style="font-family: 'IBM Plex Mono', monospace">權重 [%]</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span>成本法</span><span style="font-family: 'IBM Plex Mono', monospace">權重 [%]</span></div>
      <a href="Report.dc.html" style="font-size: 14px; color: #2747A0">看完整報告</a>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D9DDE4; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; font-weight: 700">還差 0 項可簽名</div>
      <div style="font-size: 14px; color: #1D6B43">15 項必載事項都已填寫</div>
      <div style="font-size: 13px; color: #5C6475; line-height: 1.7">簽名要在電腦上完成；手機可以確認或退回。</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="reply" style="font-size: 15px; font-weight: 700">回覆（退回時必填）</label>
      <textarea id="reply" rows="3" placeholder="例如：收益資本化率請附來源" style="padding: 10px 12px; border: 1px solid #D9DDE4; border-radius: 10px; font: 15px/1.7 'Noto Sans TC', sans-serif; background: #FFFFFF; resize: vertical"></textarea>
    </div>
  </div>

  <div style="padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #D9DDE4; display: flex; gap: 8px">
    <button type="button" style="flex: 1; height: 48px; border: 1px solid #D9DDE4; border-radius: 10px; background: #FFFFFF; color: #9A2818; font: 500 15px 'Noto Sans TC', sans-serif">退回修改</button>
    <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 10px; background: #2747A0; color: #FFFFFF; font: 500 15px 'Noto Sans TC', sans-serif">確認，進入簽名</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
