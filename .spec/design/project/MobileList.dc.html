<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：案件清單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F5F7; color: #161B26; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 16px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #D9DDE4; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">案件</h1>
      <button type="button" aria-label="帳號選單：林估價師" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #2747A0; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center">林</span></button>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <a href="MobileCase.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFFFF; border: 1px solid #D9DDE4; border-radius: 10px; text-decoration: none; color: #161B26">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5C6475">{{r.no}}</span>
          <span style="{{r.chip}}">{{r.status}}</span>
        </div>
        <span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; height: 6px; border-radius: 3px; background: #EDEFF3"><div style="height: 6px; border-radius: 3px; background: #2747A0; width: {{r.pct}}"></div></div>
          <span style="font-size: 13px; color: #3A4253">{{r.step}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="color: #3A4253">{{r.owner}}</span>
          <span style="{{r.dueStyle}}">{{r.due}}</span>
        </div>
      </a>
    </sc-for>
  </main>

  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #D9DDE4">
    <button type="button" style="width: 100%; height: 48px; border: 0; border-radius: 8px; background: #2747A0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500">新增案件</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = 'font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap; ';
    const due = 'white-space: nowrap; ';
    const fBase = 'height: 36px; flex: 0 0 auto; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; ';
    const filters = [['進行中', true], ['我負責的'], ['待我確認'], ['3 天內到期'], ['已逾期'], ['已交付'], ['全部']]
      .map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: fBase + (on ? 'border: 1px solid #2747A0; background: #2747A0; color: #FFFFFF' : 'border: 1px solid #D9DDE4; background: #FFFFFF; color: #3A4253') }));
    const rows = [
      { no: '115-0142', name: '大安區信義路四段 公寓 5 樓', step: '5/7 試算', pct: '71%', owner: '林估價師', status: '進行中', chip: pill + 'background: #E6EBF7; color: #1E3A85', due: '剩 2 天', dueStyle: due + 'color: #7A4A00; font-weight: 500' },
      { no: '115-0139', name: '新店區安康路 透天厝', step: '6/7 決定價格', pct: '86%', owner: '林估價師', status: '待確認', chip: pill + 'background: #FDF0D8; color: #7A4A00', due: '11/12', dueStyle: due + 'color: #3A4253' },
      { no: '115-0137', name: '桃園市蘆竹區 工業用地', step: '4/7 比較標的', pct: '57%', owner: '王助理', status: '退回修改', chip: pill + 'background: #FBE5E1; color: #9A2818', due: '已逾期 2 天', dueStyle: due + 'color: #9A2818; font-weight: 700' },
      { no: '115-0135', name: '中山區南京東路 商辦 12 樓', step: '3/7 現勘', pct: '43%', owner: '張助理', status: '進行中', chip: pill + 'background: #E6EBF7; color: #1E3A85', due: '剩 3 天', dueStyle: due + 'color: #7A4A00; font-weight: 500' }
    ];
    return { filters, rows };
  }
}
</script>
</body>
</html>
