<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>月曆與每人案件量</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1E3A85}
</style>
</helmet>
<div style="min-height: 1000px; background: {{p.bg}}; color: {{p.ink}}; font-family: 'Noto Sans TC', system-ui, sans-serif">
  <header style="background: #161B26; color: #EEF0F4; padding: 0 24px; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 7px; background: {{p.seal}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700" aria-hidden="true">估</div>
      <span style="font-weight: 700">○○不動產估價師事務所</span>
    </div>
    <nav style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1" aria-label="主選單">
      <a href="CaseList.dc.html" style="padding: 8px 14px; border-radius: 8px; background: #2A3142; color: #FFFFFF; text-decoration: none; font-size: 15px">案件</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">接案初估</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">估價模型</a>
      <a href="#" style="padding: 8px 14px; border-radius: 8px; color: #A9B1C2; text-decoration: none; font-size: 15px">事務所設定</a>
    </nav>
    <span style="font-size: 14px; color: #A9B1C2">林○○・估價師</span>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 24px">
    <section style="flex: 999 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 28px">115 年 11 月</h1>
          <button type="button" aria-label="上個月" style="width: 40px; height: 40px; border: 1px solid {{p.line}}; border-radius: 8px; background: #FFFFFF; color: {{p.ink}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="下個月" style="width: 40px; height: 40px; border: 1px solid {{p.line}}; border-radius: 8px; background: #FFFFFF; color: {{p.ink}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
          <label for="who" style="font-size: 14px; color: {{p.muted}}">負責人</label>
          <select id="who" style="height: 40px; padding: 0 10px; border: 1px solid {{p.line}}; border-radius: 8px; font: 15px 'Noto Sans TC', sans-serif; background: #FFFFFF"><option>全部成員</option><option>林○○</option><option>陳○○</option></select>
          <div style="display: flex; gap: 4px; background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 10px; padding: 4px">
            <a href="CaseList.dc.html" style="height: 36px; padding: 0 14px; border-radius: 7px; color: {{p.muted}}; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none">清單</a>
            <a href="CaseList.dc.html" style="height: 36px; padding: 0 14px; border-radius: 7px; color: {{p.muted}}; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none">看板</a>
            <span style="height: 36px; padding: 0 14px; border-radius: 7px; background: {{p.soft}}; color: {{p.accent}}; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center">月曆</span>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: {{p.muted}}">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #8E1F17"></span>期限</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{p.accent}}"></span>現勘</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #7A4B00"></span>交件</span>
      </div>

      <div style="background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 12px; overflow-x: auto">
        <div style="min-width: 700px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
          <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
            <div style="padding: 10px; font-size: 13px; color: {{p.muted}}; border-bottom: 1px solid {{p.line}}; text-align: center">{{w}}</div>
          </sc-for>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
            <div style="min-height: 112px; padding: 6px; border-right: 1px solid {{p.line}}; border-bottom: 1px solid {{p.line}}; background: {{d.bg}}; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: {{d.numInk}}; font-weight: {{d.numW}}">{{d.n}}</span>
              <sc-for list="{{d.events}}" as="e" hint-placeholder-count="1">
                <a href="CaseStep.dc.html" style="display: block; padding: 3px 6px; border-radius: 4px; background: {{e.bg}}; color: {{e.ink}}; font-size: 12px; line-height: 1.5; text-decoration: none; border-left: 3px solid {{e.bar}}">{{e.label}}</a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 18px">每人案件量</h2>
        <p style="margin: 0; font-size: 13px; color: {{p.muted}}">接案前先看誰還有餘力。</p>
        <sc-for list="{{load}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 15px"><span>{{m.name}}</span><span style="font-family: 'IBM Plex Mono', monospace">{{m.open}} 件</span></div>
            <div style="height: 8px; border-radius: 4px; background: {{p.line}}"><div style="height: 8px; width: {{m.bar}}; border-radius: 4px; background: {{p.accent}}"></div></div>
            <div style="font-size: 13px; color: {{m.soonInk}}">7 天內到期 {{m.soon}} 件</div>
          </div>
        </sc-for>
      </div>
      <div style="background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 18px">今天 115/11/22</h2>
        <div style="font-size: 14px; line-height: 1.7">10:00 現勘 115-0436 新竹市東區 透天厝（陳○○）</div>
        <div style="font-size: 14px; line-height: 1.7; color: #8E1F17">115-0431 已逾期 2 天，待林○○確認</div>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["青綠（沿用舊版）","地籍藍"],"default":"地籍藍"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const PAL = {
      '青綠（沿用舊版）': { accent: '#1F5E66', soft: '#E1EDEE', bg: '#F3F5F4', line: '#D3DAD9', ink: '#161B26', muted: '#5A676C', seal: '#B23A2B' },
      '地籍藍': { accent: '#2747A0', soft: '#E6EBF7', bg: '#F4F5F7', line: '#D9DDE4', ink: '#161B26', muted: '#5C6475', seal: '#B4381F' }
    };
    const p = PAL[this.props.palette ?? '地籍藍'] || PAL['地籍藍'];
    const T = { due: ['#F8E1DF', '#8E1F17', '#8E1F17'], survey: [p.soft, p.accent, p.accent], deliver: ['#FBEFD9', '#7A4B00', '#7A4B00'] };
    const ev = {
      11: [['survey', '現勘 115-0412']], 18: [['deliver', '交件 115-0398']], 20: [['due', '期限 115-0431']],
      22: [['survey', '現勘 115-0436']], 23: [['due', '期限 115-0436']], 24: [['survey', '現勘 115-0441']],
      25: [['due', '期限 115-0412'], ['deliver', '交件 115-0412']], 27: [['survey', '現勘 115-0420']]
    };
    const days = [];
    for (let i = 0; i < 35; i++) {
      const n = i + 1, inMonth = n <= 30, label = inMonth ? n : n - 30;
      const evs = inMonth ? (ev[n] || []) : (label === 5 ? [['due', '期限 115-0420']] : []);
      days.push({
        n: label, bg: inMonth ? (n === 22 ? p.soft : '#FFFFFF') : p.bg, numInk: inMonth ? p.ink : p.muted, numW: n === 22 ? 700 : 400,
        events: evs.map((e) => ({ label: e[1], bg: T[e[0]][0], ink: T[e[0]][1], bar: T[e[0]][2] }))
      });
    }
    const load = [['林○○（估價師）', 4, 2], ['陳○○（助理）', 2, 2], ['吳○○（估價師）', 0, 0]].map((m) => ({ name: m[0], open: m[1], soon: m[2], bar: Math.round(m[1] / 6 * 100) + '%', soonInk: m[2] ? '#7A4B00' : p.muted }));
    return { p: p, weekdays: ['日', '一', '二', '三', '四', '五', '六'], days: days, load: load };
  }
}
</script>
</body>
</html>
